# FILE: .config/sops/config.yaml
#
# DESCRIPTION:
# SOPS creation rules for this project. Non-standard location (mirrors the user-level
# ~/.config/sops/config.yaml convention), so it is NOT auto-discovered: every sops
# invocation must pass `--config .config/sops/config.yaml` (project mise `sops:project:*`
# tasks do this). Decryption does not need this file - recipients are embedded in the
# encrypted payload - so mise's native auto-decrypt is unaffected by the location.
#
# AGE private key: .config/sops/age/keys.txt (project key, gitignored)
#
creation_rules:
  - key_groups:
      - age:
          - age1mv3xlpqug9ykzss0rts9jpuwx6rudl54ne6sx8xt53r5ltgudels2jywpe  # project key (talos-gitops-rehearsal)
          - age1t0ge3nn3f09nwjfz2krsjmmyzauuv3294yr06hpak50jue7j2cfqwgjt8w  # user key (enables mise native decryption via XDG default)
    # encrypted_regex: '^(data|stringData)$' # Optional. Encrypt only values under 'data' or 'stringData' keys (only applies to JSON or YAML files).
    # key_regex: '.*' # Optional. If omitted in YAML/JSON, defaults to encrypting all keys. Explicitly adding is clearer.
    # path_regex: \.env(\.sops)?\.yaml$ # Optional. Only encrypt files matching this regex (.env.yaml or .env.sops.yaml)
