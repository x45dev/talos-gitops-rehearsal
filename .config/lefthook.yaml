#
# FILE: .config/lefthook.yaml
#
# DESCRIPTION:
# This file defines the Git hooks that Lefthook manages. It now calls the
# centralized `mise` tasks to ensure consistency with the CI pipeline.
#
assert_lefthook_installed: true
colors: true
fail_on_error: true

#
# HOOK: pre-commit
#
# DESCRIPTION:
# This hook ensures code health and guards against secret exposure before 
# changes are safely packaged into a git commit state.
#
pre-commit:
  parallel: true
  commands:
    lint:
      run: mise run lint

    # 🔒 GUARD 1: Prevent accidentally committing the raw plaintext template files
    secrets-leak-guard:
      files: git status --porcelain
      run: |
        if git status --porcelain | grep -q ".config/mise/.env.yaml$"; then
          echo "❌ ERROR: Plaintext secrets file (.env.yaml) is staged or modified!" >&2
          echo "💡 Fix: Run 'mise run secrets' to encrypt it, or remove it from tracking." >&2
          exit 1
        fi

    # 🔒 GUARD 2: Prevent accidentally committing raw AGE private key text files
    keys-leak-guard:
      files: git status --porcelain
      run: |
        if git status --porcelain | grep -E -q "\.config/sops/age/keys\.txt$"; then
          echo "❌ ERROR: Private AGE key file (keys.txt) is tracked, staged, or modified!" >&2
          echo "💡 Fix: Run 'git rm --cached <file>' and ensure they are added to your .gitignore file." >&2
          exit 1
        fi

    # 🔑 VALIDATE: Confirm the active key can encrypt/decrypt files seamlessly.
    #
    # FAILS OPEN when the project AGE key is absent. This hook also runs in
    # environments where that machine-local, gitignored key never exists: CI
    # runners, a fresh clone before keygen, a contributor who does not hold the
    # key, and the isolated worktree that `no-mistakes` commits inside for its
    # `review --action fix` and `document` steps. Hard-failing there makes
    # committing impossible in that environment while presenting as an unrelated
    # tool failure (diagnosed 2026-07-20 in repository-knowledge-architecture;
    # see agent-standards docs/how-to-agents.md, no-mistakes entry).
    #
    # The guard lives here on the hook invocation, deliberately NOT inside
    # `sops:project:check-key`: `manage`, `decrypt`, and `test-config` all
    # legitimately need that task to fail when the key is missing, since they
    # cannot do their job without it. When the key IS present, test-config's exit
    # code propagates normally, so a genuinely broken key configuration still
    # blocks the commit. The keys-leak-guard above remains the real secret
    # control and needs no key of its own.
    sops-integrity-check:
      run: |
        if [ -f .config/sops/age/keys.txt ]; then
          mise run sops:project:test-config
        else
          echo "sops-integrity-check: no AGE key at .config/sops/age/keys.txt - skipping (fail-open)"
        fi

#
# HOOK: commit-msg
#
# DESCRIPTION:
# Enforces Conventional Commits format so docs/CHANGELOG.md (git-cliff, see
# .config/cliff.toml) buckets every future commit correctly instead of falling
# through to a generic catch-all group.
#
commit-msg:
  commands:
    conventional-commit-lint:
      run: mise run lint:commit-msg -- {1}
