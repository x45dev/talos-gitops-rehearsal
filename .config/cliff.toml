# git-cliff configuration - Keep a Changelog format, driven by Conventional Commits.
# https://git-cliff.org/docs/configuration
#
# Regenerate with: mise run changelog

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
protect_breaking_commits = false
commit_parsers = [
  { message = "(?i)^merge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # A handful of early commits (predating this cliff.toml) were authored by the no-mistakes
  # pipeline, which prefixes with "no-mistakes(<step>): " instead of a Conventional Commits
  # type - those commits are already merged to main, so rewriting their history was out of
  # scope (would require force-pushing main). Route them by the real type nested after the
  # prefix, when present, before falling through to the generic rules below.
  { message = "^no-mistakes\\([^)]*\\):\\s*fix", group = "Fixed" },
  { message = "^no-mistakes\\([^)]*\\):\\s*docs?", group = "Changed" },
  { message = "^no-mistakes", group = "Changed" },
  { message = "^feat", group = "Added" },
  { message = "^add", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^change", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^docs?", group = "Changed" },
  { message = "^test", group = "Changed" },
  { message = "^remove", group = "Removed" },
  { message = "^revert", group = "Removed" },
  { message = "^deprecate", group = "Deprecated" },
  { body = ".*security", group = "Security" },
  { message = ".*", group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
