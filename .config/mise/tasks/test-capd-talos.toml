["test-capd-spike:setup"]
description = "1. Spin up the kind management cluster and initialize CAPI"
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_MGT

if kind get clusters | grep -q "^capi-test$"; then
    echo "=> Kind cluster 'capi-test' already exists, skipping creation."
else
    echo "=> Creating kind management cluster..."
    kind create cluster --name capi-test
fi

echo "=> Initializing CAPI..."
clusterctl init --core cluster-api --bootstrap talos --control-plane talos --infrastructure docker
"""

["test-capd-spike:provision"]
description = "2. Apply the bespoke CAPD+Talos template and extract configs"
depends = ["test-capd-spike:setup"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_MGT

# NOTE: the Docker infrastructure provider ships no `--flavor talos` template, so we
# apply a project-maintained template instead of `clusterctl generate cluster`.
# The template disables the stock CNI and kube-proxy via Talos configPatches so Cilium
# (installed in the next task with kubeProxyReplacement=true) can own both.
# Kubernetes is pinned to v1.35.x to stay inside Cilium 1.19's tested matrix.
echo "=> Applying CAPD+Talos template (idempotent)..."
kubectl apply -f .config/capi/capd-talos-template.yaml

echo "=> Waiting for Talos control plane machine to become Ready..."
kubectl wait --for=condition=Ready machine -l cluster.x-k8s.io/control-plane --timeout=8m

echo "=> Extracting workload kubeconfig..."
kubectl get secret $CLUSTER_NAME-kubeconfig -o jsonpath='{.data.value}' | base64 -d > $KUBECONFIG_WORK
chmod 600 $KUBECONFIG_WORK

# talosconfig is optional for the three spike gates (which only need KUBECONFIG_WORK);
# extract it best-effort for manual debugging.
if kubectl get secret $CLUSTER_NAME-talosconfig >/dev/null 2>&1; then
    kubectl get secret $CLUSTER_NAME-talosconfig -o jsonpath='{.data.talosconfig}' | base64 -d > $TALOSCONFIG
    chmod 600 $TALOSCONFIG
fi
"""

["test-capd-spike:cilium"]
description = "3. Patch Talos kube-proxy and install Cilium via Helm"
depends = ["test-capd-spike:provision"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Installing/Updating Cilium via Helm..."
helm repo add cilium https://helm.cilium.io/
helm repo update
helm upgrade --install cilium cilium/cilium --version 1.19.5 \
  --namespace kube-system \
  --set kubeProxyReplacement=true \
  --set k8sServiceHost=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' | awk -F/ '{print $3}' | awk -F: '{print $1}') \
  --set k8sServicePort=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' | awk -F/ '{print $3}' | awk -F: '{print $2}') \
  --set ipam.mode=kubernetes
"""

["test-capd-spike:validate"]
description = "4. Run verification gates"
depends = ["test-capd-spike:cilium"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Ensuring nginx-test deployment exists..."
kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
EOF

kubectl wait --for=condition=ready pod -l app=nginx-test --timeout=2m

# Verification Logic
POD1=$(kubectl get pods -l app=nginx-test -o jsonpath='{.items[0].metadata.name}')
POD2_IP=$(kubectl get pods -l app=nginx-test -o jsonpath='{.items[1].status.podIP}')
kubectl exec $POD1 -- curl -s --max-time 3 http://$POD2_IP
echo "✅ Pod-to-Pod communication successful."

kubectl expose deployment nginx-test --port=80 --type=LoadBalancer --dry-run=client -o yaml | kubectl apply -f -
sleep 15
EXTERNAL_IP=$(kubectl get svc nginx-test -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

if [ -z "$EXTERNAL_IP" ]; then
    echo "❌ Cilium failed to allocate an IP."
    exit 1
else
    echo "✅ LoadBalancer IP: $EXTERNAL_IP"
fi
"""

["test-capd-spike:teardown"]
description = "Destroy the management cluster and prune CAPD docker containers"
run = """
#!/usr/bin/env bash
echo "=> Destroying kind management cluster..."
kind delete cluster --name capi-test
docker rm -f $(docker ps -a -q -f label=cluster.x-k8s.io/cluster-name=$CLUSTER_NAME) 2>/dev/null || true
rm -f .kube-mgt.config .kube-workload.config .talosconfig
echo "🧹 Environment wiped clean."
"""

["test-capd-spike:all"]
description = "Run the entire spike test"
depends = ["test-capd-spike:validate"]
run = "echo 'Spike test execution complete.'"