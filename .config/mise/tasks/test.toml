# FILE: .config/mise/tasks/test.toml
#
# DESCRIPTION:
# Project test suites. Sub-suites are hidden (hide = true); run the aggregate
# `mise run test` (alias `t`). Task names are colon-namespaced (`test:*`) to match
# the `lint:*` convention.
#
# WHY IT IS IN `mise run lint`, and therefore in the pre-commit hook: the `sources`
# key below makes mise skip this task unless tests/*.bats or the validator itself
# changed, so it costs nothing on the commits that do not touch it and runs in full
# on exactly the commits that do.
#
# Measured 2026-08-02 on the dev workstation, warm, timing the whole `mise run lint`
# aggregate as the pre-commit hook actually invokes it:
#   unchanged tree      -> 0.44s and 0.38s on consecutive runs (mise skips the suite)
#   validator touched   -> ~25s total, all 26 tests run
# So the steady-state cost of having the suite in the gate is a fraction of a second,
# and the full cost lands on exactly the commits that can break it.
#
# It earns that place. Seeding a semantic regression the other linters cannot see -
# disabling rule 9c with a `false &&`, which shellcheck passes clean - makes
# `mise run lint` exit 1 on "not ok 21 spec bundle: fails when the bundle has no
# spec.md". Before this task joined the aggregate, that regression reached `main`
# and was caught only by CI.
#
# An earlier revision of this file excluded the suite from the local gate on the
# grounds that it cost 1m22s-1m38s per commit. That number was real but was a COLD
# first run, taken right after `mise install` provisioned the toolchain, and it was
# generalised to every commit without re-measuring warm or accounting for the
# `sources` cache. Corrected the same day. The lesson is worth keeping: time a task
# the way it will actually be invoked, more than once.
#
# The suite is ALSO a CI gate (.github/workflows/ci.yml), and deliberately so: CI
# checks out fresh, holds no mise cache, and covers the ungated paths CI was added to
# close (cloud agent sessions, fresh clones without the mise toolchain). Local
# caching is a speed optimisation, not the enforcement point.

["test:frontmatter"]
description = "Test: bats suite for scripts/validate-frontmatter.sh (RFC-003 rules 1-9)."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ ! -d "tests" ]; then
  echo "No tests/ directory, skipping."
  exit 0
fi
# FAILS OPEN when bats is absent, and this is a deliberate reversal of the
# lint:frontmatter pattern next door.
#
# lint:frontmatter hard-fails on a missing scripts/validate-frontmatter.sh, and it is
# right to: that is repo content, tracked in git, and its absence means someone
# deleted a gate. bats is not repo content. It is a machine-local, version-managed
# tool that legitimately does not exist yet in a fresh clone before `mise install`,
# in a contributor's environment, or in the isolated worktree no-mistakes commits
# inside.
#
# Since this task joined the `lint` aggregate it runs in the Lefthook pre-commit
# hook, so hard-failing there would block every commit in those environments -
# including the commit that installs the toolchain. That is the same trap the
# sops-integrity-check guard in .config/lefthook.yaml documents, and it fails open
# for the same reason.
#
# Nothing is lost by skipping: CI runs this suite unconditionally via npx on a fresh
# checkout, so the enforcement point still catches what a skipped local run would
# have. A loud warning, not a silent pass, so the skip is visible.
if ! command -v bats > /dev/null 2>&1; then
  echo "WARNING: bats is not on PATH, so the validator's test suite is being SKIPPED." >&2
  echo "         This is a fail-open: CI runs the same suite and will catch anything" >&2
  echo "         missed here. To run it locally, provision the toolchain: mise install" >&2
  exit 0
fi
# From here the gate is real: if bats runs and a test fails, the commit is blocked.
bats tests/
'''
sources = ["tests/*.bats", "scripts/validate-frontmatter.sh"]

[test]
description = "Run all project test suites."
alias = "t"
depends = ["test:frontmatter"]
