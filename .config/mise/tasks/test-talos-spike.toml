["test-talos-spike:setup"]
description = "1. Verify docker and talosctl are available"
run = """
#!/usr/bin/env bash
set -e

echo "=> Checking docker daemon..."
docker info >/dev/null

echo "=> Checking talosctl..."
talosctl version --client >/dev/null

echo "✅ Prerequisites present. No management cluster needed (talosctl provisions directly)."
"""

["test-talos-spike:provision"]
description = "2. Idempotently create the target Talos cluster via talosctl"
depends = ["test-talos-spike:setup"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

if [ -d "$HOME/.talos/clusters/$CLUSTER_NAME" ]; then
    echo "=> Talos cluster '$CLUSTER_NAME' already exists, skipping creation."
else
    echo "=> Creating Talos cluster '$CLUSTER_NAME' (1 control plane + 2 workers)..."
    # talosctl merges the workload kubeconfig into whatever $KUBECONFIG points at
    # (set above), so no separate `talosctl kubeconfig` extraction step is needed -
    # it also auto-detects the CNI-disabled config patch and SKIPs the node/kube-proxy/
    # coredns readiness health-checks it would otherwise block on (verified live: no
    # `--skip-k8s-node-readiness-check` flag exists in talosctl v1.13.5 at all).
    talosctl cluster create docker \
        --name "$CLUSTER_NAME" \
        --workers 2 \
        --kubernetes-version 1.35.5 \
        --config-patch @.config/talos/cni-none.patch.yaml
fi

echo "=> Waiting for the Kubernetes API to serve (not node readiness - no CNI yet)..."
attempt=1
max_attempts=90
until kubectl get --raw='/readyz' >/dev/null 2>&1; do
    if [ "$attempt" -ge "$max_attempts" ]; then
        echo "❌ Kubernetes API did not become ready after ${max_attempts} attempts." >&2
        exit 1
    fi
    attempt=$((attempt + 1))
    sleep 2
done
echo "✅ Kubernetes API is serving."
"""

["test-talos-spike:cilium"]
description = "3. Install Cilium via Helm (Talos-specific values per Sidero's guide)"
depends = ["test-talos-spike:provision"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

# Once test-talos-spike:flux-bootstrap has run, helm-controller (Flux) owns this
# release's underlying objects via server-side-apply field ownership. Re-running the
# imperative `helm upgrade --install` below against an adopted release then contests
# those same fields with a different field manager and fails outright (confirmed live,
# 2026-07-06: "Apply failed with 1 conflict: conflict with helm-controller"). Detect
# adoption and skip straight to the health checks - day-2 Cilium changes flow through
# Git from here on (plan Phase 2 step 5), never this task.
if kubectl get helmrelease cilium -n kube-system >/dev/null 2>&1; then
    echo "=> Cilium HelmRelease already exists in kube-system - Flux has adopted this release. Skipping imperative helm upgrade."
else
    echo "=> Installing/Updating Cilium via Helm..."
    helm repo add cilium https://helm.cilium.io/
    helm repo update

    # KubePrism (on by default in Talos 1.13) exposes a stable, in-node API endpoint at
    # localhost:7445 - pods inside the nodes cannot reach the host-published kubeconfig
    # port the CAPD-era task used, but every node can always reach its own KubePrism.
    # cgroup/security-context values and the explicit capability list come from Sidero's
    # Cilium-on-Talos guide: Talos forbids workload kernel-module loading, so Cilium's
    # default capability set does not carry over.
    # Pinned to 1.18.11, not 1.19.x: verified live (2026-07-06) that Cilium 1.19.5 +
    # kubeProxyReplacement=true on Talos 1.13.5 breaks host-network DNS resolution
    # node-wide (containerd image pulls and even hostNetwork pods time out resolving
    # via the node's own 127.0.0.11 embedded resolver) - this is the exact symptom
    # cilium/cilium#46010 documents. 1.18.11 is the pinned fallback per Phase 0 step 3.
    # -f reads clusters/workload/infrastructure/cilium/values.yaml directly - the same
    # file the Flux HelmRelease consumes (via a generated ConfigMap) - so this task and
    # the post-adoption HelmRelease can never drift apart into a value-changing "no-op"
    # upgrade at adoption time (doubt-driven-development review, 2026-07-07: an earlier
    # version of this task duplicated every value as --set flags instead of reading this
    # file, silently defeating the single-source-of-truth precondition in plan Phase 2
    # step 5). Chart *version* still lives here and in helmrelease.yaml separately - see
    # values.yaml's header comment for why that duplication is unavoidable.
    helm upgrade --install cilium cilium/cilium --version 1.18.11 \
      --namespace kube-system \
      -f clusters/workload/infrastructure/cilium/values.yaml

    # The Cilium chart does not annotate the agent DaemonSet with a config-checksum, so a
    # `helm upgrade` that changes agent-level flags (like enable-l2-announcements) updates
    # the ConfigMap but leaves already-running agents on their old flags until restarted
    # (confirmed live via the agent's own config-drift-checker warning). Unconditionally
    # restarting costs one DaemonSet rollout (~15-20s) even on a no-op re-run, which is
    # cheap next to correctness: detecting drift reliably would mean parsing agent state
    # from inside each pod, which is worse than paying the fixed cost every time.
    echo "=> Restarting Cilium agents to pick up any config changes..."
    kubectl rollout restart daemonset/cilium -n kube-system
    kubectl rollout status daemonset/cilium -n kube-system --timeout=3m
fi

echo "=> Waiting for Cilium to report Ready..."
kubectl wait --for=condition=Ready pod -l k8s-app=cilium -n kube-system --timeout=5m

echo "=> Waiting for all nodes to report Ready (Cilium now provides the CNI)..."
kubectl wait --for=condition=Ready node --all --timeout=5m

# Gate 3 (LB reachability): ipam.mode is pod IPAM only - LoadBalancer service IPs come
# from a separate subsystem (LB-IPAM) that allocates nothing without an explicit pool.
# Scoped to a block inside the Docker bridge subnet (10.5.0.0/24) that talosctl's
# sequential node allocation (.1 gateway, .2-.4 nodes) never reaches, so no collision
# risk as the node/worker count grows modestly.
# Allocation alone is not reachability: paired with a CiliumL2AnnouncementPolicy so
# Cilium ARPs the LB IP on the docker bridge (eth0) - the host sits on that same L2
# segment, so ARP resolution is enough, no separate host route needed (verified live).
kubectl apply -f - <<EOF
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: docker-subnet-pool
spec:
  blocks:
    - cidr: 10.5.0.240/28
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: docker-subnet-l2-policy
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth0$
  nodeSelector: {}
EOF
"""

["test-talos-spike:cloudflare-tunnel-bootstrap"]
description = "3b. Idempotently create/configure the Cloudflare Tunnel and inject its token as a k8s Secret"
depends = ["test-talos-spike:provision"]
run = """
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG=$KUBECONFIG_WORK

CF_API="https://api.cloudflare.com/client/v4"
AUTH_HEADER="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

# --- Find or create the tunnel ---
# config_src: "cloudflare" (remote-managed) means ingress rules live in Cloudflare's
# control plane, not a local config file - pushed below via the /configurations API,
# sourced from the checked-in clusters/workload/infrastructure/cloudflare-tunnel/
# ingress.yaml. See that file's header comment for the accepted trade-off (plan Phase 3
# decisions, 2026-07-11). tunnel_secret is deliberately omitted from the create call -
# it is only required for config_src: "local" tunnels (verified against Cloudflare's
# API reference, not assumed).
echo "=> Looking up Cloudflare Tunnel '$CLOUDFLARE_TUNNEL_NAME'..."
LOOKUP_RESPONSE=$(curl -sf -H "$AUTH_HEADER" \
  "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?name=$CLOUDFLARE_TUNNEL_NAME&is_deleted=false")
if [ "$(echo "$LOOKUP_RESPONSE" | jq -r '.success')" != "true" ]; then
    echo "❌ Failed to look up Cloudflare Tunnel '$CLOUDFLARE_TUNNEL_NAME': $(echo "$LOOKUP_RESPONSE" | jq -c '.errors')" >&2
    exit 1
fi
TUNNEL_ID=$(echo "$LOOKUP_RESPONSE" | jq -r '.result[0].id // empty')

if [ -n "$TUNNEL_ID" ]; then
    # A same-named tunnel created outside this task (e.g. via `cloudflared tunnel
    # login`/`create`) could be config_src: "local", in which case pushing to
    # /configurations below would silently no-op from cloudflared's perspective - it
    # would ignore the remote config entirely (doubt-driven-development finding,
    # 2026-07-11). Fail loudly rather than proceed against a tunnel this task cannot
    # actually control.
    REMOTE_CONFIG=$(echo "$LOOKUP_RESPONSE" | jq -r '.result[0].remote_config')
    if [ "$REMOTE_CONFIG" != "true" ]; then
        echo "❌ Tunnel '$CLOUDFLARE_TUNNEL_NAME' ($TUNNEL_ID) exists but is not remote-config-managed (remote_config=$REMOTE_CONFIG) - this task cannot push ingress rules to a locally-managed tunnel. Delete it or rename this task's CLOUDFLARE_TUNNEL_NAME to avoid the collision." >&2
        exit 1
    fi
fi

if [ -z "$TUNNEL_ID" ]; then
    echo "=> No existing tunnel found - creating '$CLOUDFLARE_TUNNEL_NAME'..."
    CREATE_RESPONSE=$(curl -sf -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
      "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel" \
      --data "{\"name\":\"$CLOUDFLARE_TUNNEL_NAME\",\"config_src\":\"cloudflare\"}")
    TUNNEL_ID=$(echo "$CREATE_RESPONSE" | jq -r '.result.id // empty')
    if [ -z "$TUNNEL_ID" ]; then
        echo "❌ Failed to create Cloudflare Tunnel: $(echo "$CREATE_RESPONSE" | jq -c '.errors')" >&2
        exit 1
    fi
    echo "✅ Created tunnel $TUNNEL_ID"
else
    echo "✅ Found existing tunnel $TUNNEL_ID"
fi

# --- Push the desired ingress config (unconditional PUT - cheap, no destructive
# side effect on the running connector, unlike Cilium's DaemonSet restart, so no
# before/after diff is worth the extra complexity) ---
echo "=> Pushing ingress config from clusters/workload/infrastructure/cloudflare-tunnel/ingress.yaml..."
INGRESS_JSON=$(yq -o=json eval clusters/workload/infrastructure/cloudflare-tunnel/ingress.yaml)
CONFIG_RESPONSE=$(curl -sf -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
  "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
  --data "$(jq -n --argjson ingress "$INGRESS_JSON" '{config: $ingress}')")
if [ "$(echo "$CONFIG_RESPONSE" | jq -r '.success')" != "true" ]; then
    echo "❌ Failed to push tunnel ingress config: $(echo "$CONFIG_RESPONSE" | jq -c '.errors')" >&2
    exit 1
fi
echo "✅ Ingress config applied."

# --- Ensure the DNS CNAME exists, proxied (orange-cloud) so requests route through
# the tunnel rather than resolving directly ---
echo "=> Ensuring DNS record for $IDP_DOMAIN..."
DNS_LOOKUP_RESPONSE=$(curl -sf -H "$AUTH_HEADER" \
  "$CF_API/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=CNAME&name=$IDP_DOMAIN")
if [ "$(echo "$DNS_LOOKUP_RESPONSE" | jq -r '.success')" != "true" ]; then
    echo "❌ Failed to look up DNS records for $IDP_DOMAIN: $(echo "$DNS_LOOKUP_RESPONSE" | jq -c '.errors')" >&2
    exit 1
fi
MATCH_COUNT=$(echo "$DNS_LOOKUP_RESPONSE" | jq -r '.result | length')
if [ "$MATCH_COUNT" -gt 1 ]; then
    echo "❌ Found $MATCH_COUNT CNAME records for $IDP_DOMAIN, expected at most 1 - resolve the duplicate manually before this task can safely upsert." >&2
    exit 1
fi
EXISTING_RECORD=$(echo "$DNS_LOOKUP_RESPONSE" | jq -r '.result[0] // empty')
TUNNEL_CNAME="${TUNNEL_ID}.cfargotunnel.com"
DNS_BODY=$(jq -n --arg name "$IDP_DOMAIN" --arg content "$TUNNEL_CNAME" \
  '{type: "CNAME", name: $name, content: $content, proxied: true}')

if [ -z "$EXISTING_RECORD" ]; then
    echo "   Creating new CNAME $IDP_DOMAIN -> $TUNNEL_CNAME"
    DNS_RESPONSE=$(curl -sf -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" \
      "$CF_API/zones/$CLOUDFLARE_ZONE_ID/dns_records" --data "$DNS_BODY")
else
    RECORD_ID=$(echo "$EXISTING_RECORD" | jq -r '.id')
    echo "   Updating existing CNAME record ($RECORD_ID) -> $TUNNEL_CNAME"
    DNS_RESPONSE=$(curl -sf -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/json" \
      "$CF_API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" --data "$DNS_BODY")
fi
if [ "$(echo "$DNS_RESPONSE" | jq -r '.success')" != "true" ]; then
    echo "❌ Failed to upsert DNS record: $(echo "$DNS_RESPONSE" | jq -c '.errors')" >&2
    exit 1
fi
echo "✅ DNS record in place."

# --- Fetch a fresh connector token and inject it as a k8s Secret ---
# Namespace is created imperatively here (not left to Flux) for the same chicken-egg
# reason flux-system's namespace predates its own secret injection: the Secret must
# exist before cloudflared's Deployment (Flux-reconciled) schedules a pod referencing
# it, and Flux hasn't run yet at this point in the bootstrap chain.
echo "=> Fetching tunnel token and injecting cloudflare-tunnel-token Secret..."
TUNNEL_TOKEN=$(curl -sf -H "$AUTH_HEADER" \
  "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token" | jq -r '.result')
if [ -z "$TUNNEL_TOKEN" ] || [ "$TUNNEL_TOKEN" = "null" ]; then
    echo "❌ Failed to fetch a tunnel token." >&2
    exit 1
fi
# This Namespace is also declared in Flux's cloudflare-tunnel/namespace.yaml (server-
# side apply, once Flux reconciles), so two field managers touch the same object - the
# same category of risk documented above for Cilium's HelmRelease adoption. Judged safe
# without a matching "confirmed live" claim (unlike Cilium's) because both manifests are
# byte-identical minimal Namespace objects (apiVersion/kind/metadata.name only, no
# contested fields) - not empirically verified the way the Cilium conflict was, so
# watch for this specifically during Phase 3 live verification.
kubectl create namespace cloudflare-tunnel --dry-run=client -o yaml | kubectl apply -f -
kubectl create secret generic cloudflare-tunnel-token -n cloudflare-tunnel \
  --from-literal=TUNNEL_TOKEN="$TUNNEL_TOKEN" \
  --dry-run=client -o yaml | kubectl apply -f -
echo "✅ Cloudflare Tunnel '$CLOUDFLARE_TUNNEL_NAME' ($TUNNEL_ID) ready for cloudflared to connect."
"""

["test-talos-spike:flux-bootstrap"]
description = "4. Install Flux, inject secrets, and hand Cilium day-2 management to Git"
depends = ["test-talos-spike:cilium", "test-talos-spike:cloudflare-tunnel-bootstrap"]
run = """
#!/usr/bin/env bash
set -e
set -o pipefail
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Installing Flux controllers (from the checked-in, version-pinned export)..."
kubectl apply -f clusters/workload/flux-system/gotk-components.yaml
kubectl wait --for=condition=available --timeout=3m -n flux-system deployment --all

echo "=> Injecting sops-age secret (reuses the existing project AGE key, no new key material)..."
kubectl create secret generic sops-age -n flux-system \
  --from-file=age.agekey=.config/sops/age/keys.txt \
  --dry-run=client -o yaml | kubectl apply -f -

# RETIRED: the git-credentials secret injection.
# This step used to decrypt an SSH deploy key (FLUX_GIT_DEPLOY_KEY) in memory and inject it,
# with GitHub's published host keys as known_hosts, so Flux could clone this repository over
# SSH while it was private. The repository is public now and gotk-sync.yaml's GitRepository
# clones anonymously over HTTPS with no secretRef, so there is nothing left to inject.
# The deploy key itself is revoked; do not reinstate this step without also restoring
# secretRef: git-credentials in clusters/workload/flux-system/gotk-sync.yaml.

# dex namespace is created here, not left to Flux's own namespace.yaml, for the same
# reason cloudflare-tunnel's is: the Secret below must exist before Dex's Deployment
# (Flux-reconciled) schedules a pod referencing it via envVars.secretKeyRef.
echo "=> Injecting dex-github-oauth secret (decrypted in-memory via mise/SOPS - never written to disk)..."
kubectl create namespace dex --dry-run=client -o yaml | kubectl apply -f -
kubectl create secret generic dex-github-oauth -n dex \
  --from-literal=GITHUB_CLIENT_ID="$GITHUB_OAUTH_CLIENT_ID" \
  --from-literal=GITHUB_CLIENT_SECRET="$GITHUB_OAUTH_CLIENT_SECRET" \
  --dry-run=client -o yaml | kubectl apply -f -

echo "=> Applying GitRepository + root Kustomization..."
kubectl apply -f clusters/workload/flux-system/gotk-sync.yaml

echo "=> Waiting for the root Kustomization to reconcile..."
# 16m, not 5m: the root Kustomization now sets wait: true (doubt-driven-development
# finding, 2026-07-11), so its own Ready condition genuinely waits on every nested
# Kustomization (cert-manager-controllers/-configs, dex, cloudflare-tunnel) reaching
# kstatus Ready, not just on the top-level manifests applying. Its spec.timeout is 15m;
# give kubectl wait 1m of headroom on top of that rather than racing it.
kubectl wait --for=condition=ready kustomization/flux-system -n flux-system --timeout=16m
echo "✅ Flux is reconciling clusters/workload from Git."
"""

["test-talos-spike:verify-adoption"]
description = "5. Verify Flux adopted the running Cilium release in place (no destructive reinstall)"
depends = ["test-talos-spike:flux-bootstrap"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Waiting for the Cilium HelmRelease to report Ready..."
kubectl wait --for=condition=ready helmrelease/cilium -n kube-system --timeout=5m

echo "=> Checking helm release history for a destructive reinstall..."
HISTORY_JSON=$(helm history cilium -n kube-system -o json)
REVISIONS=$(echo "$HISTORY_JSON" | jq 'length')
if [ "$REVISIONS" -lt 1 ]; then
    echo "❌ No helm release history found for 'cilium' in kube-system - adoption did not happen as expected." >&2
    exit 1
fi
if echo "$HISTORY_JSON" | jq -r '.[].status' | grep -q "^uninstalled$"; then
    echo "❌ Release history shows an 'uninstalled' revision - Flux performed a destructive reinstall instead of an in-place upgrade." >&2
    exit 1
fi

# A non-destructive upgrade can still be a *value-changing* one, which is exactly what
# the single-values-file precondition (plan Phase 2 step 5) exists to prevent - a
# values diff at adoption time would restart the CNI underneath helm-controller. History
# not showing "uninstalled" proves non-destructive; it does not prove the values matched.
# Compare what's actually deployed against the canonical file directly instead of trusting
# the two stayed in sync (doubt-driven-development review, 2026-07-07).
echo "=> Verifying deployed Cilium values match the canonical values.yaml exactly..."
DEPLOYED_VALUES=$(helm get values cilium -n kube-system -o json | jq -S .)
CANONICAL_VALUES=$(yq -o=json eval clusters/workload/infrastructure/cilium/values.yaml | jq -S .)
if [ "$DEPLOYED_VALUES" != "$CANONICAL_VALUES" ]; then
    echo "❌ Deployed Cilium values differ from clusters/workload/infrastructure/cilium/values.yaml - adoption was non-destructive but changed values, which would have restarted the CNI." >&2
    diff <(echo "$DEPLOYED_VALUES") <(echo "$CANONICAL_VALUES") >&2 || true
    exit 1
fi
echo "✅ Deployed values match the canonical file exactly."

echo "=> Confirming Cilium agents and nodes are still healthy after adoption..."
kubectl wait --for=condition=Ready pod -l k8s-app=cilium -n kube-system --timeout=3m
kubectl wait --for=condition=Ready node --all --timeout=3m

echo "✅ Cilium HelmRelease adopted the existing release in place ($REVISIONS revision(s) recorded, none uninstalled)."
"""

["test-talos-spike:validate"]
description = "6. Run the three verification gates"
depends = ["test-talos-spike:flux-bootstrap"]
run = """
#!/usr/bin/env bash
set -e
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Gate 1: cluster is healthy (nodes Ready, already verified by 'cilium' task)."
kubectl get nodes -o wide

echo "=> Gate 2: cross-node pod-to-pod connectivity..."
kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nginx-test
              topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: nginx:alpine
EOF

kubectl wait --for=condition=ready pod -l app=nginx-test --timeout=2m

POD1=$(kubectl get pods -l app=nginx-test -o jsonpath='{.items[0].metadata.name}')
POD2=$(kubectl get pods -l app=nginx-test -o jsonpath='{.items[1].metadata.name}')
NODE1=$(kubectl get pod "$POD1" -o jsonpath='{.spec.nodeName}')
NODE2=$(kubectl get pod "$POD2" -o jsonpath='{.spec.nodeName}')

if [ "$NODE1" = "$NODE2" ]; then
    echo "❌ Both test pods landed on the same node ($NODE1) - anti-affinity did not take effect, gate 2 would pass vacuously." >&2
    exit 1
fi
echo "   Pods scheduled on distinct nodes: $NODE1, $NODE2"

POD2_IP=$(kubectl get pod "$POD2" -o jsonpath='{.status.podIP}')
kubectl exec "$POD1" -- curl -s --max-time 3 "http://$POD2_IP"
echo "✅ Cross-node pod-to-pod communication successful."

echo "=> Gate 3: LoadBalancer IP allocation and reachability..."
kubectl expose deployment nginx-test --port=80 --type=LoadBalancer --dry-run=client -o yaml | kubectl apply -f -

EXTERNAL_IP=""
attempt=1
max_attempts=30
while [ -z "$EXTERNAL_IP" ]; do
    EXTERNAL_IP=$(kubectl get svc nginx-test -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
    if [ -n "$EXTERNAL_IP" ]; then
        break
    fi
    if [ "$attempt" -ge "$max_attempts" ]; then
        echo "❌ Cilium failed to allocate a LoadBalancer IP after ${max_attempts} attempts." >&2
        exit 1
    fi
    attempt=$((attempt + 1))
    sleep 2
done
echo "   LoadBalancer IP allocated: $EXTERNAL_IP"

echo "=> Verifying the LoadBalancer IP is reachable from the host..."
attempt=1
max_attempts=30
until curl -s --max-time 2 "http://$EXTERNAL_IP" >/dev/null; do
    if [ "$attempt" -ge "$max_attempts" ]; then
        echo "❌ LoadBalancer IP $EXTERNAL_IP allocated but not reachable from the host after ${max_attempts} attempts." >&2
        exit 1
    fi
    attempt=$((attempt + 1))
    sleep 2
done
echo "✅ LoadBalancer IP $EXTERNAL_IP reachable from host."
"""

["test-talos-spike:verify-phase3"]
description = "7. Verify the Phase 3 turnkey payload against the plan's exit criteria (Dex + Cloudflare Tunnel)"
depends = ["test-talos-spike:flux-bootstrap"]
run = """
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG=$KUBECONFIG_WORK

echo "=> Checking dex and cloudflare-tunnel Kustomizations reached Ready..."
kubectl wait --for=condition=ready kustomization/dex -n flux-system --timeout=1m
kubectl wait --for=condition=ready kustomization/cloudflare-tunnel -n flux-system --timeout=1m
echo "✅ Both per-component Kustomizations Ready."

echo "=> Checking the dex-tls Certificate was issued from local-ca (proves the local Root CA chain end-to-end, not just that it exists unused)..."
kubectl wait --for=condition=ready certificate/dex-tls -n dex --timeout=1m
ISSUER=$(kubectl get certificate/dex-tls -n dex -o jsonpath='{.spec.issuerRef.name}')
if [ "$ISSUER" != "local-ca" ]; then
    echo "❌ dex-tls Certificate issuerRef is '$ISSUER', expected 'local-ca'." >&2
    exit 1
fi
echo "✅ cert-manager issued dex-tls from local-ca."

echo "=> Checking the Cloudflare Tunnel reports a live connection..."
CF_API="https://api.cloudflare.com/client/v4"
AUTH_HEADER="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
TUNNEL_STATUS=$(curl -sf -H "$AUTH_HEADER" \
  "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?name=$CLOUDFLARE_TUNNEL_NAME&is_deleted=false" \
  | jq -r '.result[0].status')
if [ "$TUNNEL_STATUS" != "healthy" ]; then
    echo "❌ Tunnel status is '$TUNNEL_STATUS', expected 'healthy' - cloudflared may not have connected yet." >&2
    exit 1
fi
echo "✅ Tunnel status: healthy."

echo "=> Checking Dex serves its OIDC discovery document through the tunnel (end-to-end request reaches the in-cluster service)..."
attempt=1
max_attempts=30
until DISCOVERY=$(curl -sf --max-time 5 "https://$IDP_DOMAIN/.well-known/openid-configuration" 2>/dev/null); do
    if [ "$attempt" -ge "$max_attempts" ]; then
        echo "❌ https://$IDP_DOMAIN/.well-known/openid-configuration unreachable after ${max_attempts} attempts (DNS propagation or tunnel routing not settled)." >&2
        exit 1
    fi
    attempt=$((attempt + 1))
    sleep 2
done
DISCOVERY_ISSUER=$(echo "$DISCOVERY" | jq -r '.issuer')
if [ "$DISCOVERY_ISSUER" != "https://$IDP_DOMAIN" ]; then
    echo "❌ Discovery document issuer is '$DISCOVERY_ISSUER', expected 'https://$IDP_DOMAIN'." >&2
    exit 1
fi
echo "✅ Dex OIDC discovery document served through the tunnel, issuer matches."

# A real OAuth round trip needs a human in a browser, out of scope for automated
# verification - no staticClient is registered (deliberately, see dex/helmrelease.yaml),
# so /auth can't be driven end-to-end here. This checks the layer below it instead: the
# Secret's value actually reached the pod's environment, which combined with dexidp/
# dex's source-verified expand_env default (see helmrelease.yaml's header comment) is
# the practical stopping point for automated verification of the GitHub connector.
echo "=> Confirming GITHUB_CLIENT_ID reached the Dex pod's environment..."
DEX_POD=$(kubectl get pods -n dex -l app.kubernetes.io/name=dex -o jsonpath='{.items[0].metadata.name}')
POD_CLIENT_ID=$(kubectl exec -n dex "$DEX_POD" -- printenv GITHUB_CLIENT_ID)
SECRET_CLIENT_ID=$(kubectl get secret dex-github-oauth -n dex -o jsonpath='{.data.GITHUB_CLIENT_ID}' | base64 -d)
if [ "$POD_CLIENT_ID" != "$SECRET_CLIENT_ID" ]; then
    echo "❌ Dex pod's GITHUB_CLIENT_ID env var does not match the injected Secret." >&2
    exit 1
fi
echo "✅ GITHUB_CLIENT_ID reached the Dex pod's environment."

echo "=> Checking for zero SOPS decryption failures across all Kustomizations..."
DECRYPT_FAILURES=$(kubectl get kustomizations -A -o json | jq -r '.items[] | select(.status.conditions[]? | select(.reason == "DecryptionFailed")) | .metadata.name')
if [ -n "$DECRYPT_FAILURES" ]; then
    echo "❌ Kustomization(s) with a DecryptionFailed condition: $DECRYPT_FAILURES" >&2
    exit 1
fi
echo "✅ Zero SOPS decryption failures."

echo "🎉 Phase 3 exit criteria met."
"""

["test-talos-spike:teardown"]
description = "Destroy the Talos cluster and verify zero residue"
run = """
#!/usr/bin/env bash
set -e
echo "=> Destroying Talos cluster '$CLUSTER_NAME'..."
talosctl cluster destroy --name "$CLUSTER_NAME"

echo "=> Verifying zero residue..."
LEFTOVER_CONTAINERS=$(docker ps -a -q -f "label=talos.cluster.name=$CLUSTER_NAME" 2>/dev/null || true)
if [ -n "$LEFTOVER_CONTAINERS" ]; then
    echo "   Removing leftover containers..."
    docker rm -f $LEFTOVER_CONTAINERS
fi

LEFTOVER_NETWORK=$(docker network ls -q -f "name=^${CLUSTER_NAME}$" 2>/dev/null || true)
if [ -n "$LEFTOVER_NETWORK" ]; then
    echo "   Removing leftover network..."
    docker network rm "$LEFTOVER_NETWORK"
fi

if [ -d "$HOME/.talos/clusters/$CLUSTER_NAME" ]; then
    echo "❌ Leftover talosctl cluster state directory: $HOME/.talos/clusters/$CLUSTER_NAME" >&2
    exit 1
fi

if grep -q "$CLUSTER_NAME" "$HOME/.kube/config" 2>/dev/null; then
    echo "❌ Leftover '$CLUSTER_NAME' context in the global kubeconfig ($HOME/.kube/config)." >&2
    exit 1
fi

rm -f "$KUBECONFIG_WORK" "$TALOSCONFIG"
echo "🧹 Environment wiped clean, zero residue confirmed."
"""

["test-talos-spike:all"]
description = "Run the entire spike test"
depends = ["test-talos-spike:validate", "test-talos-spike:verify-adoption", "test-talos-spike:verify-phase3"]
run = "echo 'Spike test execution complete.'"
