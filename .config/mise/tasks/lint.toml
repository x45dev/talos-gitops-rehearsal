# FILE: .config/mise/tasks/lint.toml
#
# DESCRIPTION:
# Project linting tasks. All sub-linters are hidden (hide = true); run the aggregate
# `mise run lint` (alias `l`). Task names are colon-namespaced (`lint:*`) so they are
# visually distinct from user-level inherited tasks.

["lint:links"]
description = "Linter: Check for broken markdown links across the repo."
hide = true
raw = true
run = "lychee **/*.md"
sources = ["**/*.md"]

["lint:md"]
description = "Markdown: Auto-fix em dashes and structural issues (markdownlint-cli2)."
hide = true
run = """
#!/usr/bin/env -S bash -euo pipefail
find . -name "*.md" \
  -not -path "*/.git/*" \
  -not -path "*/node_modules/*" \
  -not -path "*/.claude/*" \
  -exec sed -i 's/—/-/g' {} +
npx --yes markdownlint-cli2 --config .config/markdownlint/config.yaml "**/*.md" "#.git/**" "#node_modules/**" "#.claude/**"
"""
sources = ["**/*.md", ".config/markdownlint/config.yaml"]

["lint:vale"]
description = "Markdown prose: Validate with vale (em dash, custom RKA rules)."
hide = true
depends = ["lint:md"]
run = """
#!/usr/bin/env -S bash -euo pipefail
mapfile -t md_files < <(find . -name "*.md" \
  -not -path "*/.git/*" \
  -not -path "*/node_modules/*" \
  -not -path "*/.claude/*")
vale "${md_files[@]}"
"""
sources = ["**/*.md", ".config/vale/**"]

["lint:shellcheck"]
description = "Linter: Statically analyze shell scripts with shellcheck."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
found="$(find . -type f -name "*.sh" -not -path "*/.git/*")"
if [ -z "$found" ]; then
  echo "No .sh files found, skipping shellcheck."
  exit 0
fi
mapfile -t sh_files <<< "$found"
shellcheck "${sh_files[@]}"
'''
sources = ["**/*.sh"]

["lint:shfmt"]
description = "Linter: Check shell script formatting with shfmt (-w autofixes in place)."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
found="$(find . -type f \( -name "*.sh" -o -path "./.config/mise/bin/*" \) -not -path "*/.git/*" -not -name "*.md")"
if [ -z "$found" ]; then
  echo "No shell scripts found, skipping shfmt."
  exit 0
fi
mapfile -t targets <<< "$found"
shfmt -w -i 2 -ci -sr "${targets[@]}"
'''
sources = ["**/*.sh", ".config/mise/bin/*"]

["lint:commit-msg"]
description = "Linter: Enforce Conventional Commits format on commit messages (commit-msg hook, not part of the pre-commit `lint` aggregate)."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
msg_file="$1"
subject="$(head -1 "$msg_file")"
pattern='^(feat|fix|docs?|style|refactor|perf|test|chore|build|ci|revert|add|change|remove|deprecate)(\([a-z0-9./_+-]+\))?!?: .+'
if [[ "$subject" =~ ^Merge ]] || [[ "$subject" =~ ^Revert\ \" ]]; then
  exit 0
fi
if ! [[ "$subject" =~ $pattern ]]; then
  echo "ERROR: Commit subject doesn't follow Conventional Commits format." >&2
  echo "   Got:      $subject" >&2
  echo "   Expected: <type>[(scope)][!]: <subject>, e.g. \"fix(dex): correct issuer URL\"" >&2
  echo "   Types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert, add, change, remove, deprecate" >&2
  exit 1
fi
'''

["lint:frontmatter"]
description = "Linter: Validate frontmatter in knowledge/ markdown documents (RFC-003 section 3)."
hide = true
run = """
#!/usr/bin/env bash
set -euo pipefail
# Two distinct states, deliberately not conflated (the old guard's conflation made
# this gate a silent no-op for a week when the script went missing):
#   1. No knowledge/ directory: nothing is governed here, skipping is legitimate.
#   2. knowledge/ exists but the validator script is missing: the gate CANNOT run,
#      and a gate that cannot run must fail loudly, never skip.
if [ ! -d "knowledge" ]; then
  echo "No knowledge/ directory, skipping frontmatter lint"
  exit 0
fi
if [ ! -f "scripts/validate-frontmatter.sh" ]; then
  echo "ERROR: knowledge/ exists but scripts/validate-frontmatter.sh is missing." >&2
  echo "       The frontmatter gate cannot run; restore the validator (RKA ADR-0012: take it from the tagged rka-template release)." >&2
  exit 1
fi
scripts/validate-frontmatter.sh
"""
sources = ["knowledge/**/*.md", "scripts/validate-frontmatter.sh"]

[lint]
description = "Run all project linters in parallel."
alias = "l"
# backend:lint/frontend:lint were removed (2026-07-12): dead references to tasks that don't
# exist in this repo (there is no backend/frontend app code here, only infra), which broke
# every `mise run lint` invocation unconditionally.
depends = ["lint:shfmt", "lint:shellcheck", "lint:links", "lint:vale", "lint:frontmatter"]
