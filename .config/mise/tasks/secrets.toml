# FILE: .config/mise/tasks/secrets.toml
#
# DESCRIPTION:
# Project-level SOPS/AGE secrets management. Namespaced `sops:project:*` to distinguish
# from the user-level `sops:user:*` tasks inherited from the global mise setup.
#
# SOPS config: .config/sops/config.yaml (non-standard location; passed via --config).
# AGE key:     .config/sops/age/keys.txt (project key; path carried as SOPS_AGE_KEY_FILE).

["sops:project:check-key"]
description = "SOPS/AGE: Structural sanity check of the project AGE key."
hide = true
raw = true
run = """
#!/usr/bin/env bash
set -euo pipefail
KEY_FILE=".config/sops/age/keys.txt"
if [ ! -f "$KEY_FILE" ]; then
    echo "AGE key file not found at $KEY_FILE!"
    echo "Please run 'mise run sops:project:generate-keypair' to create one."
    exit 1
fi
echo "AGE key $KEY_FILE found. Public key is:"
grep 'public key' "$KEY_FILE"
"""

["sops:project:generate-keypair"]
description = "SOPS/AGE: Generate a new project AGE keypair and print the public key."
run = """
#!/usr/bin/env -S bash -euo pipefail
KEY_FILE=".config/sops/age/keys.txt"
mkdir -p "$(dirname "$KEY_FILE")"
if [ -f "$KEY_FILE" ]; then
    echo "Key file $KEY_FILE already exists."
    echo "Public key: $(age-keygen -y "$KEY_FILE")"
    exit 0
fi
age-keygen -o "$KEY_FILE"
chmod 600 "$KEY_FILE"
PUBLIC_KEY="$(age-keygen -y "$KEY_FILE")"
echo "Generated $KEY_FILE"
echo "Public key: $PUBLIC_KEY"
echo ""
echo "IMPORTANT: Add this public key to .config/sops/config.yaml, then run"
echo "  SOPS_AGE_KEY_FILE=$KEY_FILE sops --config .config/sops/config.yaml updatekeys .config/mise/.env.sops.yaml"
"""

["sops:project:manage"]
alias = "project-secrets"
depends = ["sops:project:check-key"]
description = "SOPS/AGE: Create (from template) and edit the encrypted project secrets file."
raw = true
env = { SOPS_AGE_KEY_FILE = "{{env.MISE_SOPS_AGE_KEY_FILE}}" }
run = """
#!/usr/bin/env bash
set -euo pipefail
SECRETS_FILE=".config/mise/.env.sops.yaml"
TEMPLATE_FILE=".config/mise/.env.yaml.template"
if [ ! -f "$SECRETS_FILE" ]; then
    echo "Secrets file $SECRETS_FILE not found. Creating from template..."
    cp "$TEMPLATE_FILE" "$SECRETS_FILE"
    sops --config .config/sops/config.yaml --encrypt --in-place "$SECRETS_FILE"
    echo "Initialized and encrypted $SECRETS_FILE."
fi
echo "Opening $SECRETS_FILE in editor..."
sops --config .config/sops/config.yaml edit "$SECRETS_FILE"
"""

["sops:project:decrypt"]
depends = ["sops:project:check-key"]
description = "SOPS/AGE: DEBUG ONLY - Decrypt project secrets to stdout."
env = { SOPS_AGE_KEY_FILE = "{{env.MISE_SOPS_AGE_KEY_FILE}}" }
run = "sops --decrypt .config/mise/.env.sops.yaml"

["sops:project:test-config"]
depends = ["sops:project:check-key"]
description = "SOPS/AGE: Round-trip encrypt/decrypt test using the project key."
env = { SOPS_AGE_KEY_FILE = "{{env.MISE_SOPS_AGE_KEY_FILE}}" }
run = """
#!/usr/bin/env -S bash -euo pipefail
export SOPS_AGE_RECIPIENTS=$(age-keygen -y \"$SOPS_AGE_KEY_FILE\")
echo '{"test":"json-input"}' |\
  sops --encrypt --input-type=json --output-type=json /dev/stdin |\
  sops --decrypt --input-type=json --output-type=yaml /dev/stdin |\
  yq '.test = \"success!\"'
"""
