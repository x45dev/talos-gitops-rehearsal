# Bespoke CAPD + Talos cluster template.
# There is no upstream `--flavor talos` template for the Docker infrastructure provider
# (the maintained Sidero template collection ships aws/gcp only), so this template is
# authored and maintained by this project. API versions target the provider set that
# `clusterctl init --bootstrap talos --control-plane talos --infrastructure docker`
# installs today (CAPD core v1.13.x; Talos providers on the v1alpha3 CRD contract).
# CNI and kube-proxy are disabled here via Talos configPatches so Cilium can own both.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: talos-cilium-test
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
    kind: TalosControlPlane
    name: talos-cilium-test-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: DockerCluster
    name: talos-cilium-test
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerCluster
metadata:
  name: talos-cilium-test
  namespace: default
spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: talos-cilium-test-cp
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: talos-cilium-test-cp
  namespace: default
spec:
  replicas: 1
  version: v1.35.0
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: DockerMachineTemplate
    name: talos-cilium-test-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: v1.13
      configPatches:
        - op: add
          path: /cluster/network/cni
          value:
            name: none
        - op: add
          path: /cluster/proxy
          value:
            disabled: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: DockerMachineTemplate
metadata:
  name: talos-cilium-test-worker
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: talos-cilium-test-worker
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.13
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: talos-cilium-test-worker
  namespace: default
spec:
  clusterName: talos-cilium-test
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: talos-cilium-test
      version: v1.35.0
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: talos-cilium-test-worker
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: DockerMachineTemplate
        name: talos-cilium-test-worker
