# Devcontainer for talos-gitops-rehearsal (see ADR-0006, which reopens ADR-0003's
# "no devcontainer for v1" now that a concrete cross-machine need exists: running
# agent/dev sessions on a second host - the Tailscale-joined VPS - against the
# same toolchain the laptop uses).
#
# This DEFAULT service is a plain, sandboxed dev container: no Docker access, no
# host networking. It is what runs on the VPS for unattended agent sessions, so
# it deliberately holds no path to the host. Editing, linting, committing, and
# SOPS-decrypting all work here; running the Talos cluster does not (by design).
#
# To run the cluster (talosctl's Docker provisioner) you must OPT IN with the
# cluster overlay, and only on a host you actually run clusters on (the laptop):
#   docker compose -f compose.yaml -f compose.cluster.yaml up -d
# That overlay grants Docker-socket access, which is host-root-equivalent - see
# compose.cluster.yaml and ADR-0006 for why it is kept out of the default.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Runs as the image's non-root `dev` (uid 1000 = the host account, guaranteed
    # by the VPS cloud-init uid pin), so bind-mounted files line up.
    volumes:
      # The project itself, live.
      - ..:/workspaces/talos-gitops-rehearsal:cached
      # The AGE private key for in-container SOPS decryption; never baked in.
      - ${HOME}/.config/sops/age/keys.txt:/home/dev/.config/sops/age/keys.txt:ro
    # `init: true` puts docker's own init (tini) at PID 1 so exec'd processes get
    # reaped; without it `sleep infinity` would be PID 1 and reap nothing. The
    # sleep just keeps the container up so you exec in and run a zellij/Claude
    # session over Tailscale.
    init: true
    command: ["sleep", "infinity"]
