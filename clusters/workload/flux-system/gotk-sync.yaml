# The GitRepository source and root Kustomization Flux reconciles from.
# Applied by `test-talos-spike:flux-bootstrap` (not `flux bootstrap github` - that
# command commits these manifests into the remote itself, which this project's
# bootstrap task deliberately avoids; they are checked in here instead).
#
# Local iteration: `spec.ref.branch` below tracks `main` by default. To test
# uncommitted manifest changes against an ephemeral cluster, push them to a scratch
# branch and repoint this field at it:
#   kubectl patch gitrepository/flux-system -n flux-system --type=merge \
#     -p '{"spec":{"ref":{"branch":"<scratch-branch>"}}}'
# Repoint back to `main` (and re-apply this file, or patch again) when done.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  # No secretRef: this repository is public, so Flux clones it anonymously over
  # HTTPS and needs no credential. The deploy-key-backed `git-credentials` secret
  # this used while the repository was private is retired (see the bootstrap task).
  url: https://github.com/x45dev/talos-gitops-rehearsal.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/workload
  prune: true
  # wait: true is load-bearing, not decorative (doubt-driven-development finding,
  # 2026-07-11): without it, this Kustomization reports Ready as soon as `kubectl
  # apply` of its own manifests succeeds - which includes the child Kustomization CRs
  # (cert-manager-controllers/-configs, dex, cloudflare-tunnel) as *applied objects*,
  # not as *reconciled*. Flux only performs the kstatus readiness wait that makes
  # `kubectl wait --for=condition=ready kustomization/flux-system` mean anything for
  # those children when wait: true is set here too. Without this, test-talos-spike:
  # flux-bootstrap's closing wait could report success while Dex or the Cloudflare
  # Tunnel were still stuck or failing underneath it.
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
